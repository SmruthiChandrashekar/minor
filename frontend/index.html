<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puravankara GRM Portal</title>
    <link rel="icon" type="image/png" href="/purvankaraimg.png" />
    <link rel="apple-touch-icon" href="/purvankaraimg.png" />
    <meta name="theme-color" content="#001a4d" />
    <meta name="description" content="Lodge and track workplace grievances securely — even offline." />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Theme Initialization Script (Prevents Flicker) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem("theme");
          const theme = savedTheme || "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
